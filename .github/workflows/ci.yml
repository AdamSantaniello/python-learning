name: CI

# Runs on every push (including direct pushes to main) and on PRs if any are
# ever opened. No PR is required for this to run.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python (.python-version)
        run: uv python install

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Tests (pytest)
        run: uv run pytest
